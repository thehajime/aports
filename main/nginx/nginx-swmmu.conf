worker_processes 1;
user root;
daemon on;
master_process on;
pid /tmp/nginx-swmmu.pid;
error_log stderr notice;

events {
	worker_connections 256;
}

http {
	access_log off;
	server {
		listen 0.0.0.0:8080;
		server_name localhost;
		root /var/www/localhost/htdocs;
		location / {
			try_files $uri $uri/ =404;
		}
	}
	server {
		listen 0.0.0.0:8443 ssl;
		server_name localhost;
		ssl_certificate /etc/nginx/swmmu.crt;
		ssl_certificate_key /etc/nginx/swmmu.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		root /var/www/localhost/htdocs;
		location / {
			try_files $uri $uri/ =404;
		}
	}
}
