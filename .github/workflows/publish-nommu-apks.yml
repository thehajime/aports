name: Publish temporary UML NOMMU APK profiles

on:
  push:
    branches:
      - nommu-uml-master-swmmu
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: linux-private ref used to build the SWMMU compiler plugin and UAPI
        required: true
        type: string
        default: feature-swmmu-nommu
      aports_ref:
        description: aports source revision for the NOMMU package profiles
        required: true
        type: string
        default: nommu-uml-master-swmmu

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout aports at the triggering commit
        uses: actions/checkout@v6
        with:
          repository: thehajime/aports
          ref: ${{ inputs.aports_ref || github.sha }}
          path: aports-source
          sparse-checkout: |
            main/busybox
            main/coreutils
            main/musl
            main/nginx
            main/openssl
            main/python3
            main/zlib
            main/apk-tools
            main/ncurses
            main/pcre
            main/libcap
            main/zsh
            community/emacs
            scripts/swmmu-profile.sh
            scripts/swmmu-cc
            scripts/swmmu-prepare.sh
      - name: Checkout the SWMMU kernel source
        uses: actions/checkout@v6
        with:
          repository: thehajime/linux-private
          ref: ${{ inputs.kernel_ref || 'feature-swmmu-nommu' }}
          path: kernel-source
          fetch-depth: 1
      - name: Use the aports package build helper
        uses: actions/checkout@v6
        with:
          repository: thehajime/aports
          ref: ${{ inputs.aports_ref || github.sha }}
          path: aports-ci
          sparse-checkout: .github/workflows
      - name: Record exact source revisions
        id: source-revisions
        run: |
          echo "kernel_sha=$(git -C kernel-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "aports_sha=$(git -C aports-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build signed NOMMU APK profiles
        run: |
          mkdir -p "$RUNNER_TEMP/nommu-apks" "$RUNNER_TEMP/aports-distfiles"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/aports-source:/src:ro" \
            --volume "$GITHUB_WORKSPACE/kernel-source:/kernel:ro" \
            --volume "$GITHUB_WORKSPACE/aports-ci/.github/workflows:/ci:ro" \
            --volume "$RUNNER_TEMP/nommu-apks:/out" \
            --volume "$RUNNER_TEMP/aports-distfiles:/var/cache/distfiles" \
            mirror.gcr.io/library/alpine:edge sh /ci/build-nommu-apks.sh
      - name: Create source manifest and package archive
        env:
          KERNEL_SHA: ${{ steps.source-revisions.outputs.kernel_sha }}
          APORTS_SHA: ${{ steps.source-revisions.outputs.aports_sha }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/nommu-apks"
          cat > "$RUNNER_TEMP/nommu-apks/manifest.txt" <<EOF
          kernel_repository=https://github.com/thehajime/linux-private
          kernel_commit=$KERNEL_SHA
          aports_repository=https://github.com/thehajime/aports
          aports_commit=$APORTS_SHA
          aports_branch=nommu-uml-master-swmmu
          profiles=nommu-plain,nommu-swmmu
          alpine_base=edge
          swmmu_packages=libcrypto3,libssl3,openssl-dev,zlib-nommu,apk-tools-nommu,python3-nommu,nginx-nommu,coreutils-nommu,ncurses-nommu,pcre-nommu,libcap-nommu,zsh-nommu,emacs-nommu
          swmmu_direct_window=1
          emacs_dump=generated-in-guest-after-installation
          EOF
          tar -czf "$RUNNER_TEMP/nommu-apks.tar.gz" -C "$RUNNER_TEMP/nommu-apks" .
      - name: Publish prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-nommu-${{ steps.source-revisions.outputs.kernel_sha }}-${{ steps.source-revisions.outputs.aports_sha }}
          target_commitish: master
          name: Temporary NOMMU APKs for kernel ${{ steps.source-revisions.outputs.kernel_sha }}
          body_path: ${{ runner.temp }}/nommu-apks/manifest.txt
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/nommu-apks.tar.gz
